spring.application.name=apigateway
server.port=8080

eureka.client.service-url.defaultZone=http://localhost:8761/eureka

spring.cloud.gateway.server.webflux.routes[0].id=msusuario
spring.cloud.gateway.server.webflux.routes[0].uri=lb://msusuario
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/v1/usuarios/**

spring.cloud.gateway.server.webflux.routes[1].id=msequipamento
spring.cloud.gateway.server.webflux.routes[1].uri=lb://msequipamento
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/v1/equipamentos/**

spring.cloud.gateway.server.webflux.routes[2].id=msemprestimo
spring.cloud.gateway.server.webflux.routes[2].uri=lb://msemprestimo
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/v1/emprestimos/**
