server:
  port: 8083

spring:
  application:
    name: msemprestimo

  datasource:
    # URL de conexão com PostgreSQL
    url: jdbc:postgresql://${DB_HOST:localhost}:5433/emprestimo
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:1234}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    # Cria o schema automaticamente se necessário (opcional)
    create-schemas: true

  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 2000
            read-timeout: 5000
            logger-level: basic

logging:
  level:
    br.com.emprestimo.msemprestimo.client: DEBUG

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
